# Environnement staging full-stack : tire les 3 images PUBLIÉES sans jamais reconstruire.
# Utilisation : ./scripts/deploy-staging.sh v1.0.0
name: eventflow-staging

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
    env_file: [.env.staging]
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d eventflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant}/eventflow-backend:${IMAGE_TAG:?IMAGE_TAG manquant}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/eventflow
      DB_USERNAME: eventflow
      CORS_ALLOWED_ORIGINS: http://localhost:${STAGING_PORT:-8082}
    env_file: [.env.staging]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant}/eventflow-frontend:${IMAGE_TAG:?IMAGE_TAG manquant}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant}/eventflow-proxy:${IMAGE_TAG:?IMAGE_TAG manquant}
    ports:
      - "${STAGING_PORT:-8082}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata-staging:
