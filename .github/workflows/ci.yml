name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Contrôle du projet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Script de contrôle (atelier 2)
        run: bash scripts/check-project.sh

  frontend-tests:
    name: Tests frontend (Node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint ESLint
        run: npm run lint
      - name: Vérification TypeScript
        run: npx tsc --noEmit
      - name: Tests Vitest (JUnit)
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=report-frontend.xml
      - name: Rapport frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-frontend-node${{ matrix.node }}
          path: frontend/report-frontend.xml

  backend-tests:
    name: Tests backend (Java ${{ matrix.java }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/eventflow_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Vérification Maven
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Rapports backend Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-backend-java${{ matrix.java }}
          path: backend/target/surefire-reports/

  docker-build:
    name: Build et publication des 3 images
    needs: [frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Préfixe GHCR en minuscules
        run: echo "REGISTRY_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR (uniquement sur tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build / Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/eventflow-backend:{1}', env.REGISTRY_PREFIX, github.ref_name) || 'eventflow-backend:ci' }}
      - name: Build / Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: NEXT_PUBLIC_API_URL=
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/eventflow-frontend:{1}', env.REGISTRY_PREFIX, github.ref_name) || 'eventflow-frontend:ci' }}
      - name: Build / Push proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/eventflow-proxy:{1}', env.REGISTRY_PREFIX, github.ref_name) || 'eventflow-proxy:ci' }}

  deploy-staging:
    name: Déploiement automatique staging
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Générer .env.staging depuis les secrets GitHub
        env:
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          {
            echo "POSTGRES_PASSWORD=${DB_PASSWORD}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "ADMIN_EMAIL=admin@eventflow.local"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "PAYMENT_API_KEY=staging-fictif"
            echo "PAYMENT_SECRET_KEY=staging-fictif"
          } > .env.staging
      - name: Déployer la version du tag et contrôler /health
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: GHCR_OWNER="${GHCR_OWNER,,}" bash scripts/deploy-staging.sh "${GITHUB_REF_NAME}"
