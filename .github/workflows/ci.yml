name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Contrôle du projet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Script de contrôle (atelier 2)
        run: bash scripts/check-project.sh

  frontend-tests:
    name: Tests frontend
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint ESLint
        run: npm run lint
      - name: Vérification des types TypeScript
        run: npx tsc --noEmit
      - name: Tests Vitest (rapport JUnit)
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=report-frontend.xml
      - name: Rapport frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-frontend
          path: frontend/report-frontend.xml

  backend-tests:
    name: Tests backend
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/eventflow_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Vérification Maven (tests + packaging)
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Rapports backend Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-backend
          path: backend/target/surefire-reports/

  docker-build:
    name: Build des 3 images Docker
    needs: [frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: eventflow-backend:ci
      - name: Build image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: NEXT_PUBLIC_API_URL=
          tags: eventflow-frontend:ci
      - name: Build image proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: false
          tags: eventflow-proxy:ci
